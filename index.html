  function updateConsole(status){let consoleEl=$('#terminal-output');if(consoleEl){consoleEl.textContent=lastOutput||t('idle');consoleEl.classList.toggle('error',lastError);}if(status&&$('#runner-status'))$('#runner-status').textContent=status;const btn=$('#run-code');if(btn){btn.disabled=awaiting;btn.innerHTML=ico('play',18)+(awaiting?t('running'):t('run'));}}
  // Run Python in a same-origin ES module worker (required by Pyodide 314).
  function stopWorker(){if(runTimeout){clearTimeout(runTimeout);runTimeout=null;}if(worker){worker.terminate();worker=null;}}
  function runCode(){const code=$('#code-editor')?.value||'';if(!code.trim()){lastOutput=t('empty');lastError=true;updateConsole();return;}if(awaiting)return;state.editor=code;state.stdin=$('#stdin-field')?.value||'';persist();awaiting=true;lastError=false;lastOutput='';updateConsole(t('loading'));runTimeout=setTimeout(()=>{stopWorker();awaiting=false;lastError=true;lastOutput=state.lang==='ar'?'انتهت مهلة تحميل بايثون. تحقق من الإنترنت ثم جرّب مرة أخرى.':'Python loading timed out. Check your internet connection and try again.';updateConsole(t('ready'));},120000);
    try {
      if(!worker){worker=new Worker('./python-worker.js', {type:'module'});}
      worker.onmessage=e=>{
        if(e.data.kind==='loading'){updateConsole(t('loading'));return;}
        if(e.data.kind==='executing'){if(runTimeout)clearTimeout(runTimeout);runTimeout=setTimeout(()=>{stopWorker();awaiting=false;lastError=true;lastOutput=t('timeout');updateConsole(t('ready'));},15000);updateConsole(t('executing'));return;}
        if(e.data.kind==='failed'){stopWorker();awaiting=false;lastError=true;lastOutput=t('failed')+'\n'+(e.data.message||'');updateConsole(t('ready'));return;}
        if(e.data.kind==='result'){if(runTimeout)clearTimeout(runTimeout);runTimeout=null;awaiting=false;lastError=!!e.data.error;lastOutput=e.data.output;updateConsole(t('ready'));}
      };
      worker.onerror=()=>{stopWorker();awaiting=false;lastError=true;lastOutput=t('failed');updateConsole(t('ready'));};
      worker.postMessage({code:state.editor,stdin:state.stdin});
    }catch(e){stopWorker();awaiting=false;lastError=true;lastOutput=t('failed')+'\n'+e.message;updateConsole(t('ready'));}
  }

  }
  function renderProgress(){$('#progress').innerHTML=`<div class="eyebrow">${t('course')}</div><h1 style="margin:10px 0">${t('progressTitle')}</h1><p class="muted">${t('progressDesc')}</p><div class="card" style="text-align:center;padding:31px"><div style="font-size:54px;font-weight:900;color:var(--yellow)">${progressPct()}%</div><div class="muted">${state.done.length} ${t('total')} ${lessons.length} ${t('completed')}</div><div class="progress-track"><div class="progress-fill" style="width:${progressPct()}%"></div></div>${state.done.length===lessons.length?`<div class="pill green">${t('courseDone')}</div>`:''}</div><div class="stats"><div class="stat"><span class="stat-icon">🏅</span><strong>${state.best===null?'—':state.best+' / '+questions.length}</strong><small>${t('best')}</small></div><div class="stat"><span class="stat-icon">📘</span><strong>${state.done.length}</strong><small>${t('completed')}</small></div></div><div class="section-head"><h2>${t('course')}</h2></div><div class="lesson-list">${lessons.map(lessonTile).join('')}</div><div class="alert">${t('storage')}</div><button class="ghost full" id="reset-progress">${t('resetAll')}</button>`;attachLessonButtons($('#progress'));$('#reset-progress').onclick=()=>{if(confirm(t('confirmReset'))){state.done=[];state.best=null;persist();render();}};}
  function renderNav(){const items=[['home','home'],['lessons','book'],['lab','terminal'],['quiz','quiz'],['progress','chart']];$('#bottom-nav').innerHTML=items.map(([id,ic])=>`<button type="button" class="nav-btn ${screen===id?'active':''}" data-screen="${id}" aria-current="${screen===id?'page':'false'}">${ico(ic,21)}<span>${t(id)}</span></button>`).join('');$('#bottom-nav').querySelectorAll('button').forEach(btn=>btn.onclick=()=>setScreen(btn.dataset.screen));}
  function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('#subtitle').textContent=t('subtitle');$('#lang-ar').classList.toggle('active',state.lang==='ar');$('#lang-en').classList.toggle('active',state.lang==='en');document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===screen));renderNav();renderHome();renderLessons();renderLab();renderQuiz();renderProgress();}
  $('#lang-ar').onclick=()=>{state.lang='ar';persist();render();};$('#lang-en').onclick=()=>{state.lang='en';persist();render();};
  render();
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
