  // Code diagnostics: lightweight, on-device suggestions while typing, plus Python ast.parse on demand.

  const keywordTypos = {retrun:'return', retun:'return', els:'else', esle:'else', elfi:'elif', iff:'if', wihle:'while', whlie:'while', fro:'for', improt:'import', impot:'import', clss:'class', calss:'class', defini:'def'};

  function tokenDistance(a,b){
    // Damerau-Levenshtein: handles a missing letter and adjacent transpositions such as pirnt.
    const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
    for(let i=0;i<=a.length;i++)d[i][0]=i;
    for(let j=0;j<=b.length;j++)d[0][j]=j;
    for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){

  function syntaxFix(issue,code){

        <div class="course-note">${cText('هذه الشروحات والأمثلة تطبيقات تعليمية أضفناها؛ الملخص المرفق أساسه أسئلة مراجعة.','These tutorials and examples are added explanations; the uploaded notes mainly contain questions.')}</div>
        ${unit.topics.map((topic,i)=>`<details class="course-topic" ${i===0?'open':''}><summary><span class="topic-number">${i+1}</span><strong>${esc(cLoc(topic.title))}</strong><span class="chevron">⌄</span></summary><div class="topic-body"><p class="muted">${esc(cLoc(topic.explain))}</p><div class="card-label">${cText('مثال برمجي','Python example')}</div><pre class="code-box">${esc(topic.code)}</pre><button class="secondary full" type="button" data-crun="${i}">${ico('terminal',17)} ${cText('جرّب المثال في المختبر','Try this in Code Lab')}</button></div></details>`).join('')}
        <button class="primary full" type="button" data-cquiz="${esc(unit.id)}" style="margin-top:20px">${ico('quiz',18)} ${cText('اختبر معلوماتك — 10 أسئلة','Take the 10-question unit test')}</button>`;
    }
    if(courseMode==='quiz'){
      const set=syllabus.sets[selectedSet];
      if(courseIndex>=set.q.length){
        const bests=state.courseBests||{};bests[selectedSet]=Math.max(bests[selectedSet]??0,courseScore);state.courseBests=bests;persist();
        target.innerHTML=`<button class="back" data-cback="1">‹ ${cText('العودة إلى المنهج','Back to course')}</button><div class="course-result"><div style="font-size:68px">🏆</div><div class="eyebrow">${esc(cLoc(set.name))}</div><h1>${cText('انتهى الاختبار!','Quiz Complete!')}</h1><div class="score-big">${courseScore} / ${set.q.length}</div><p class="muted">${Math.round(100*courseScore/set.q.length)}% · ${cText('أفضل درجة محفوظة على هذا الجهاز','Your best score is saved on this device')}</p><button class="primary full" type="button" data-cretry="1">${cText('إعادة الاختبار','Try Again')}</button><button class="ghost full" type="button" data-cback="1" style="margin-top:10px">${cText('كل الوحدات','All units')}</button></div>`;
      }else{
        const q=set.q[courseIndex];
        const kind=set.kind;
        const choices=kind==='tf'? [cText('صحيح','True'),cText('خطأ','False')]:q.options;
        const correct=kind==='tf'?(q.answer===true?0:1):q.answer;
        const sideNote=q.note==='project'?cText('تنبيه: إجابة التجميعة مبنية على كود مشروع المستشفى، وهذا الكود غير موجود ضمن الملفات.','Note: This answer depends on hospital-project code that was not included.'):
            q.note==='environment'?cText('تنبيه: تثبيت NumPy يعتمد على البيئة وإصدار الحزم، لذا راجع حالة بيئتك.','Note: Installing NumPy depends on your environment and dependencies.'):
            q.note==='approx'?cText('تنبيه: الخيار B هو الأقرب بين الخيارات؛ صياغته غير دقيقة، لأن الاستيراد قد يشمل أصنافًا ومتغيرات أيضًا.','Note: B is the nearest option, but the wording is imprecise: wildcard imports may include classes and variables too.'):
            q.note==='context'?cText('معلومة: الوصول إلى حالة الصنف من staticmethod ممكن بصياغة صريحة، لكن لا تصلها تلقائيًا.','Static methods can access a class explicitly, but do not receive cls automatically.'):
            q.note==='ambiguous'?cText('تنبيه: توجد فروق بين list وarray.array؛ مفتاح الملخص لهذا السؤال يحتاج تدقيقًا سياقيًا.','Note: Python lists and array.array differ; the source key needs contextual review.'):'';
        const qHead=state.lang==='ar'?q.ar:q.en;
        const qSub=state.lang==='ar'?q.en:q.ar;
        target.innerHTML=`<button class="back" type="button" data-cback="1">‹ ${cText('العودة إلى المنهج','Back to course')}</button><div class="eyebrow">${esc(cLoc(set.name))}</div><h1 style="margin:10px 0">${cText('اختبار المراجعة','Review Quiz')}</h1><div class="quiz-top"><span>${cText('السؤال','Question')} ${courseIndex+1} / ${set.q.length}</span><span>✦ ${courseScore}</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*courseIndex/set.q.length}%"></div></div>
          <div class="card"><div class="card-label">${kind==='tf' ? cText('صح أم خطأ؟','True or False?') : cText('اختر الإجابة الصحيحة','Choose the correct answer')}</div><h2 style="line-height:1.7;margin:0 0 13px;font-size:19px" dir="auto">${esc(qHead)}</h2><p class="muted" style="margin:0" dir="auto">${esc(qSub)}</p></div>
          <div>${choices.map((choice,i)=>`<button type="button" class="quiz-choice ${coursePicked===i?'selected':''} ${courseAnswered&&i===correct?'correct':''} ${courseAnswered&&i===coursePicked&&i!==correct?'wrong':''}" data-cpick="${i}" ${courseAnswered?'disabled':''}><b>${kind==='tf'?(i===0?'✓':'×'):'ABCD'[i]}</b><span dir="auto">${esc(choice)}</span></button>`).join('')}</div>
          ${courseAnswered?`<div class="feedback"><strong>${coursePicked===correct?'✅ '+cText('إجابة صحيحة','Correct'):'💡 '+cText('الإجابة الصحيحة','Correct answer')+': '+esc(choices[correct])}</strong><div>${esc(cLoc(q.why || [ 'الإجابة بحسب التجميعة المرفقة.', 'Answer key from the uploaded compilation.' ]))}</div>${sideNote?`<div style="color:#ffd469;margin-top:8px">⚠ ${esc(sideNote)}</div>`:''}</div>`:''}
          ${selectedSet==='activity2'?`<div class="course-note">${cText('أسئلة هذا النشاط تفترض الاطلاع على كود نظام المستشفى؛ لا تتعامل مع مفتاح التجميعة على أنه برهان مستقل.','These questions presuppose hospital source code, which was not provided.')}</div>`:''}
          <button class="primary full" type="button" data-cnext="1" style="margin-top:15px">${courseAnswered?(courseIndex===set.q.length-1?cText('عرض النتيجة','See Results'):cText('السؤال التالي','Next Question')):cText('تحقق من الإجابة','Check Answer')}</button>`;
      }
    }
    target.onclick=e=>{
      const button=e.target.closest('button');if(!button)return;
      if(button.dataset.cback){courseMode='overview';renderItbs();scrollCourse();return;}
      if(button.dataset.cunit){courseMode='unit';selectedUnit=button.dataset.cunit;renderItbs();scrollCourse();return;}
      if(button.dataset.crun!==undefined){let unit=syllabus.units.find(u=>u.id===selectedUnit);let topic=unit?.topics[Number(button.dataset.crun)];if(topic){state.editor=topic.code;state.stdin='';persist();setScreen('lab');}return;}
      if(button.dataset.cquiz){selectedSet=button.dataset.cquiz;courseMode='quiz';courseIndex=0;courseScore=0;coursePicked=null;courseAnswered=false;renderItbs();scrollCourse();return;}
      if(button.dataset.cretry){courseIndex=0;courseScore=0;coursePicked=null;courseAnswered=false;renderItbs();scrollCourse();return;}
      if(button.dataset.cpick!==undefined){if(courseAnswered)return;coursePicked=Number(button.dataset.cpick);renderItbs();return;}
      if(button.dataset.cnext){if(!courseAnswered){if(coursePicked===null){alert(cText('اختر إجابة أولًا','Please choose an answer.'));return;}let q=syllabus.sets[selectedSet].q[courseIndex];let answer=syllabus.sets[selectedSet].kind==='tf'?(q.answer?0:1):q.answer;if(coursePicked===answer)courseScore++;courseAnswered=true;}else{courseIndex++;coursePicked=null;courseAnswered=false;}renderItbs();if(courseIndex<syllabus.sets[selectedSet].q.length)scrollCourse();return;}
    };
  }

  function renderNav(){const items=[['home','home'],['lessons','book'],['itbs','grad'],['lab','terminal'],['quiz','quiz'],['progress','chart']];$('#bottom-nav').innerHTML=items.map(([id,ic])=>`<button type="button" class="nav-btn ${screen===id?'active':''}" data-screen="${id}" aria-current="${screen===id?'page':'false'}">${ico(ic,21)}<span>${t(id)}</span></button>`).join('');$('#bottom-nav').querySelectorAll('button').forEach(btn=>btn.onclick=()=>setScreen(btn.dataset.screen));}
  function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('#subtitle').textContent=t('subtitle');$('#lang-ar').classList.toggle('active',state.lang==='ar');$('#lang-en').classList.toggle('active',state.lang==='en');document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===screen));renderNav();renderHome();renderLessons();renderLab();renderQuiz();renderProgress();renderItbs();}
  $('#lang-ar').onclick=()=>{state.lang='ar';persist();render();};$('#lang-en').onclick=()=>{state.lang='en';persist();render();};
  render();
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
